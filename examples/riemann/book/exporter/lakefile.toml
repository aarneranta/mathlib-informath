name = "GrhBook"
defaultTargets = ["deps"]
# the dependencies as grh-lean/grh-compact has them (its lake exe cache get)
packagesDir = "../../../../../grh-lean/grh-compact/.lake/packages"

[[require]]
name = "GRH"
path = "../../../../../grh-lean/grh-compact"

[[lean_exe]]
name = "deps"
root = "Deps"
supportInterpreter = true

[[lean_exe]]
name = "export"
root = "Export"
supportInterpreter = true
